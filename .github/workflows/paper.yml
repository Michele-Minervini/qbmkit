name: Draft JOSS paper

# Renders paper/paper.md to PDF with the Open Journals toolchain so the draft can be
# previewed without installing pandoc/LaTeX locally.  The PDF is uploaded as a build
# artifact; nothing is published.
on:
  push:
    paths: ['paper/**', '.github/workflows/paper.yml']
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
