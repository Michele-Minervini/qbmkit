[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbmkit"
version = "0.1.0"
description = "The unifying open-source library for Quantum Boltzmann Machines (QBMs)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michele Minervini" }]
keywords = [
    "quantum boltzmann machine", "qbm", "quantum machine learning",
    "gibbs state", "quantum natural gradient", "quantum fisher information",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
# heavy / future backends are opt-in extras so the base install stays light
jax = ["jax>=0.4", "jaxlib>=0.4"]
tn = ["quimb>=1.7"]
circuit = ["qiskit>=1.0"]
pennylane = ["pennylane>=0.34"]
notebooks = ["matplotlib>=3.5", "jupyter", "nbformat", "nbclient"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "hypothesis>=6",
    "quimb>=1.7",
    "qiskit>=1.0",
    "matplotlib>=3.5",
    "nbclient",
    "nbformat",
]

[project.urls]
Homepage = "https://github.com/micheleminervini/qbmkit"
Documentation = "https://github.com/micheleminervini/qbmkit/blob/main/DESIGN.md"
Issues = "https://github.com/micheleminervini/qbmkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    # `O` (observable), `I` (identity) and `l` (index) are standard notation in
    # quantum physics; renaming them would make the code harder to read, not easier.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# compact `tp = theta.copy(); tp[j] += eps` pairs in finite-difference helpers
"tests/*" = ["E702"]
